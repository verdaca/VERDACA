[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-adapter-channels-slack"
version = "0.1.0"
description = "Verdaca Slack channel adapter for GatewayPort"
requires-python = ">=3.12"
dependencies = [
    "praxis-ports",
    "praxis-kernel-gateway",
    "praxis-kernel-auth",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.uv.sources]
praxis-ports = { workspace = true }
praxis-kernel-gateway = { workspace = true }
praxis-kernel-auth = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
