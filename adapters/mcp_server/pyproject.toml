[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-adapter-mcp-server"
version = "0.1.0"
description = "Verdaca inbound MCP server adapter for GatewayPort"
requires-python = ">=3.12"
dependencies = [
    "praxis-ports",
    # Stage 14 Day-2: the runtime composition (build_runtime_gateway /
    # compose_auth_quartet) was HOISTED to the neutral praxis-composition member;
    # mcp_server/http.py now consumes it from there. tools.py uses anyio for the
    # Option A worker-thread offload. (The in_tree_compaction_stub / kernel-auth /
    # session-index deps below were composition.py's; retained pending a dep-prune.)
    "praxis-composition",
    "praxis-adapter-in_tree_compaction_stub",
    "praxis-kernel-auth",
    "praxis-kernel-gateway",
    "praxis-kernel-session-index",
    "anyio>=4",
    "mcp==1.27.0",
    "pydantic>=2.0",
]

[tool.uv.sources]
praxis-ports = { workspace = true }
praxis-composition = { workspace = true }
praxis-adapter-in_tree_compaction_stub = { workspace = true }
praxis-kernel-auth = { workspace = true }
praxis-kernel-gateway = { workspace = true }
praxis-kernel-session-index = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
