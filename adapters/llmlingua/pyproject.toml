[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-adapter-llmlingua"
version = "0.1.0"
description = "Verdaca Compaction port adapter — PyPI-pinned wrap of the llmlingua SDK (ADR-9.1.2-4 §3; port-contracts.md v0.2.6)"
requires-python = ">=3.12"
dependencies = [
    "praxis-ports",
    "pydantic>=2.0",
    "llmlingua==0.2.2",
]

[tool.uv.sources]
praxis-ports = { workspace = true }
# llmlingua resolves from the PyPI registry; sha256 lock recorded in the
# workspace-root uv.lock at Cleo 9.6 supply-chain review.

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
