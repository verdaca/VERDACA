[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-pi-mono"
version = "0.1.0"
description = "Pi-Mono — Verdaca cost tracker (measurement foundation)"
requires-python = ">=3.12"
authors = [
    {name = "Verdaca Engineering"},
]
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.6,<3",
    "python-ulid>=2.2",
    "sqlalchemy>=2.0.25,<3",
    "aiosqlite>=0.19",
    "structlog>=24.1",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "prometheus-client>=0.19",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "mypy>=1.8",
    "ruff>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["praxis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests",
    "property: Hypothesis property tests",
    "golden: golden-file fixtures",
    "integration: full tracker integration",
    "stress: slow, nightly",
    "reconciliation: requires invoice fixtures",
    "static: AST / mypy / ruff",
    "postgres: requires Docker Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PLC", "PLE", "PLR", "PLW"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
