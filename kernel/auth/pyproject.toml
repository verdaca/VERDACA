[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-kernel-auth"
version = "0.1.0"
description = "Verdaca kernel auth primitives for OIDC, JWT validation, claims validation, and nonce replay protection"
requires-python = ">=3.11"
dependencies = [
    "praxis-ports",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.uv.sources]
praxis-ports = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.setuptools.package-data]
"praxis.kernel.auth" = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src", "../../ports/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
