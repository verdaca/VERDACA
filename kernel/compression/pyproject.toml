[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-compression"
version = "0.1.0"
description = "Praxis Compression Layer — Stage 2 (TONL + Forge + Caveman + RTK)"
requires-python = ">=3.11"
authors = [
    {name = "Praxis Engineering"},
]
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.6,<3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.27",
]
openai = [
    "tiktoken>=0.6",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "mypy>=1.8",
    "ruff>=0.2",
    "jinja2>=3.1",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "property: Hypothesis property tests",
    "golden: golden-file fixture tests",
    "adversarial: adversarial corpus tests",
    "integration: full pipeline integration",
    "nightly: slow nightly tests (require LLM API)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
