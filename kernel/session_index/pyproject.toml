[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-kernel-session-index"
version = "0.1.0"
description = "Verdaca SessionIndexPort + SkillTelemetryPort package (Stage 10)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "praxis-ports",
]

[tool.uv.sources]
praxis-ports = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.setuptools.package-data]
"praxis.kernel.session_index" = ["py.typed"]
"praxis.kernel.session_index.schema" = ["*.sql"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src", "../../ports/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
