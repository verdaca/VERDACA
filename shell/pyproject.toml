[project]
name = "praxis-shell"
version = "0.1.0"
description = "Praxis POV Delivery Harness — Stage 7 (Web UI + Auth + Billing + API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.0,<3",
    "python-ulid>=3.0,<4",
    "httpx>=0.28,<1",
    "sse-starlette>=2.0,<3",
    "stripe>=12.0,<13",
    "pyjwt[crypto]>=2.9,<3",
    "sentry-sdk[fastapi]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["api", "."]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not nightly_only and not release_gate",
]

markers = [
    # Inherited vocabulary
    "critical: test is release-blocking if failing",
    "integration: multi-component wire-up test",
    "static: collection-time / grep-based structural test",
    "nightly_only: runs in nightly CI only, NOT PR gate",
    "release_gate: runs on release candidate only, manual trigger",

    # Shell-specific markers (test-strategy §4.1)
    "shell_adapt: adapter contract test (C-2/C-3/C-4)",
    "shell_auth: authentication / authorization test",
    "shell_bill: billing / Stripe test",
    "shell_tenant: tenant isolation test",
    "shell_sess: session lifecycle test",
    "shell_dash: public dashboard test",
    "shell_sse: SSE streaming test",
    "shell_e2e: end-to-end Playwright test",
]

# -------------------------------------------------------------------------
# Coverage — target >= 75% overall, >= 85% backend per test-strategy §6.1.
# -------------------------------------------------------------------------
[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "tests"]
