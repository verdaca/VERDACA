[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-contract-tests"
version = "0.1.0"
description = "Verdaca port contract tests — Amelia 9.5 surface (Stage 9.4.1 partial: VS port only)"
requires-python = ">=3.12"
dependencies = [
    "praxis-ports",
    "praxis-adapter-beads",
    "praxis-adapter-in_tree_compaction_stub",
    "praxis-adapter-pi_mono_native",
    "praxis-adapter-litellm",
    "praxis-adapter-mcp-server",
    "praxis-adapter-mem0",
    "praxis-adapter-letta",
    "praxis-adapter-llmlingua",
    "praxis-kernel-gateway",
    "praxis-kernel-session-index",
    "asyncpg==0.31.0",
    "aiosqlite>=0.19",
    "hypothesis==6.152.4",
    "import-linter>=2.11",
    "mcp==1.27.0",
    "mypy==2.1.0",
    "pydantic>=2.0",
    "pytest>=7.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "testcontainers[postgres]==4.14.2",
]

[tool.uv.sources]
praxis-ports = { workspace = true }
praxis-adapter-beads = { workspace = true }
praxis-adapter-in_tree_compaction_stub = { workspace = true }
praxis-adapter-pi_mono_native = { workspace = true }
praxis-adapter-litellm = { workspace = true }
praxis-adapter-mcp-server = { workspace = true }
praxis-adapter-mem0 = { workspace = true }
praxis-adapter-letta = { workspace = true }
praxis-adapter-llmlingua = { workspace = true }
praxis-kernel-gateway = { workspace = true }
praxis-kernel-session-index = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "no_waiver: Stage-9 non-waivable contract invariant; inventory-locked by tests/src/praxis/contract_tests/ports/test_no_waiver_inventory.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "B"]
# N802 (function naming) intentionally NOT selected — test names embed
# MAC-T IDs verbatim (e.g., test_M_T_VS_SNAPSHOT_01_*) per test-strategy.md
# v0.2 §2.2.3 auditability discipline.
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["praxis"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
