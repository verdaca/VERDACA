# Synthetic LiteLLM virtual-key cassette for Stage 12 H#4.
# Contains no live LiteLLM proxy data and no secrets.
interactions:
  - request:
      method: POST
      uri: https://litellm.example.invalid/key/generate
    response:
      status:
        code: 200
      headers:
        content-type: application/json
      body:
        string: |
          {"key":"sk-stage12-generated","spend":0.0}
