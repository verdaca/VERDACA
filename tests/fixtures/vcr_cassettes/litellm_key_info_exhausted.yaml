# Synthetic LiteLLM key-list cassette for Stage 12 H#4.
# Security-relevant: spend equals max_budget and must block budget checks.
interactions:
  - request:
      method: GET
      uri: https://litellm.example.invalid/key/list?key_alias=stage12-key&return_full_object=true
    response:
      status:
        code: 200
      headers:
        content-type: application/json
      body:
        string: |
          {"keys":[{"key_alias":"stage12-key","token":"sk-stage12-existing","spend":25.0,"max_budget":25.0}],"total_count":1,"current_page":1,"total_pages":1}
